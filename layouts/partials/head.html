
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · SHADO{{ end }}</title><meta name="description" content="{{ .Description | default .Site.Params.description }}">
<meta name="theme-color" content="#07080a"><link rel="canonical" href="{{ .Permalink }}">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · SHADO{{ end }}"><meta property="og:description" content="{{ .Description | default .Site.Params.description }}"><meta property="og:type" content="website"><meta property="og:url" content="{{ .Permalink }}"><meta property="og:image" content="{{ "images/social.png" | absURL }}"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ "images/symbol.svg" | relURL }}" type="image/svg+xml">
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
{{ $js := resources.Get "js/main.js" | minify | fingerprint }}<script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
